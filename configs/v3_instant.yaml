name: v3_instant
description: >
  The published iteration. Lane changes are instantaneous and collision is tested
  by lane index equality. Hyperparameters are identical to v5, so the two configs
  differ only in environment mechanics.
env:
  lane_transition: instant
  obs_depth: 20
  position_feature: lane
  spawn_interval: 10
  max_frames: 3000
train:
  total_timesteps: 1000000
  n_envs: 8
  n_stack: 4
  net_arch: [1024, 1024, 1024]
  n_steps: 2048
  batch_size: 256
  learning_rate: 0.00005
  ent_coef: 0.01
