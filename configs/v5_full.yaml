name: v5_full
description: >
  Reproduction of the original long V5 run on a 12 thread CPU with an RTX 3060.
  Heavier than the default. Use v5_smooth.yaml for a quick run.
env:
  lane_transition: smooth
  obs_depth: 20
  position_feature: lane
train:
  total_timesteps: 5000000
  n_envs: 12
  n_stack: 4
  net_arch: [1024, 1024, 1024]
  n_steps: 16384
  batch_size: 2048
  learning_rate: 0.00005
  ent_coef: 0.01
  device: cuda
