name: continuous_position
description: Reports true pixel position rather than a rounded lane index, removing the mismatch between the observation and the collision test.
env: {lane_transition: smooth, obs_depth: 20, position_feature: continuous}
train: {total_timesteps: 1000000, n_envs: 8, n_stack: 4, net_arch: [1024, 1024, 1024], n_steps: 2048, batch_size: 256, learning_rate: 0.00005, ent_coef: 0.01}
