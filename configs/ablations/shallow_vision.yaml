name: shallow_vision
description: Five forward segments rather than twenty. Tests how much lookahead the task needs.
env: {lane_transition: smooth, obs_depth: 5, position_feature: lane}
train: {total_timesteps: 1000000, n_envs: 8, n_stack: 4, net_arch: [1024, 1024, 1024], n_steps: 2048, batch_size: 256, learning_rate: 0.00005, ent_coef: 0.01}
